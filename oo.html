<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR 手势粒子互动系统</title>
    <!-- 使用unpkg CDN确保依赖加载成功 -->
    <script src="https://unpkg.com/three@0.136.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.136.0/examples/js/controls/OrbitControls.js"></script>
    <!-- MediaPipe Hands 使用直接链接避免路径问题 -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0a0a1a;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            padding: 12px 20px;
            background: rgba(10, 10, 26, 0.95);
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .header h1 {
            font-size: 22px;
            background: linear-gradient(90deg, #00ffff, #0080ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 0.5px;
            margin-right: 15px;
        }
        
        .header .subtitle {
            font-size: 13px;
            color: #a0e7ff;
            opacity: 0.9;
        }
        
        .stats-container {
            display: flex;
            gap: 15px;
            font-size: 13px;
        }
        
        .stat-item {
            background: rgba(0, 30, 60, 0.4);
            padding: 5px 10px;
            border-radius: 4px;
            border: 1px solid rgba(0, 150, 255, 0.2);
        }
        
        .container {
            display: flex;
            flex: 1;
            position: relative;
            min-height: 0; /* 修复flex布局溢出问题 */
        }
        
        #canvasContainer {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        
        #arCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: block;
        }
        
        #webcam {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 200px;
            height: 150px;
            border-radius: 6px;
            border: 2px solid rgba(0, 255, 255, 0.5);
            box-shadow: 0 0 12px rgba(0, 200, 255, 0.3);
            z-index: 2;
            object-fit: cover;
            transform: scaleX(-1); /* 镜像翻转，更自然 */
        }
        
        .control-panel {
            width: 280px;
            background: rgba(5, 10, 30, 0.92);
            border-left: 1px solid rgba(0, 255, 255, 0.15);
            padding: 15px;
            overflow-y: auto;
            z-index: 10;
            backdrop-filter: blur(5px);
        }
        
        .control-section {
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(0, 150, 255, 0.15);
        }
        
        .control-section h3 {
            font-size: 15px;
            margin-bottom: 12px;
            color: #00ccff;
            display: flex;
            align-items: center;
        }
        
        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
            background-color: #ff3333;
        }
        
        .status-indicator.active {
            background-color: #00ff88;
            box-shadow: 0 0 6px #00ff88;
        }
        
        .gesture-list {
            list-style: none;
            margin-top: 8px;
        }
        
        .gesture-list li {
            padding: 6px 10px;
            margin-bottom: 6px;
            background: rgba(0, 40, 80, 0.3);
            border-radius: 5px;
            border-left: 3px solid #00aaff;
            display: flex;
            align-items: center;
            transition: all 0.3s;
            font-size: 13px;
        }
        
        .gesture-list li.active {
            background: rgba(0, 120, 255, 0.25);
            border-left: 3px solid #00ffff;
            box-shadow: 0 0 8px rgba(0, 180, 255, 0.3);
        }
        
        .gesture-list li .gesture-icon {
            width: 22px;
            height: 22px;
            margin-right: 8px;
            background: rgba(0, 80, 200, 0.2);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
        }
        
        .gesture-list li .gesture-name {
            flex: 1;
        }
        
        .slider-container {
            margin-bottom: 12px;
        }
        
        .slider-container label {
            display: block;
            margin-bottom: 4px;
            font-size: 13px;
            color: #a0e7ff;
        }
        
        .slider-container input {
            width: 100%;
            height: 5px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(0, 80, 180, 0.2);
            border-radius: 3px;
            outline: none;
        }
        
        .slider-container input::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #00aaff;
            cursor: pointer;
            border: 2px solid #ffffff;
        }
        
        .instructions {
            background: rgba(0, 15, 35, 0.7);
            padding: 12px;
            border-radius: 6px;
            border-left: 3px solid #00ffff;
            margin-top: 20px;
            font-size: 12px;
        }
        
        .instructions h4 {
            color: #00ffff;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .instructions ul {
            list-style: none;
        }
        
        .instructions li {
            margin-bottom: 5px;
            padding-left: 12px;
            position: relative;
        }
        
        .instructions li:before {
            content: "•";
            color: #00aaff;
            position: absolute;
            left: 0;
        }
        
        .loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s;
        }
        
        .loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(0, 255, 255, 0.2);
            border-top: 4px solid #00ffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            font-size: 16px;
            color: #00ffff;
            letter-spacing: 0.5px;
        }
        
        .particle-count {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 20, 40, 0.75);
            padding: 6px 10px;
            border-radius: 5px;
            font-size: 13px;
            z-index: 5;
            border: 1px solid rgba(0, 255, 255, 0.25);
            backdrop-filter: blur(3px);
        }
        
        .hand-speed {
            position: absolute;
            top: 10px;
            left: 150px;
            background: rgba(0, 20, 40, 0.75);
            padding: 6px 10px;
            border-radius: 5px;
            font-size: 13px;
            z-index: 5;
            border: 1px solid rgba(255, 100, 0, 0.25);
            backdrop-filter: blur(3px);
        }
        
        .transition-effect {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            font-weight: bold;
            color: #00ffff;
            opacity: 0;
            pointer-events: none;
            z-index: 20;
            text-shadow: 0 0 12px rgba(0, 255, 255, 0.8), 0 0 24px rgba(0, 100, 255, 0.5);
            transition: opacity 0.5s;
            text-align: center;
            white-space: nowrap;
        }
        
        /* 响应式设计 */
        @media (max-width: 1024px) {
            .container {
                flex-direction: column;
            }
            
            .control-panel {
                width: 100%;
                height: auto;
                max-height: 40vh;
                border-left: none;
                border-top: 1px solid rgba(0, 255, 255, 0.15);
            }
            
            #webcam {
                width: 150px;
                height: 112px;
            }
        }
        
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
                padding: 10px;
            }
            
            .header h1 {
                font-size: 18px;
                margin-bottom: 5px;
            }
            
            .stats-container {
                width: 100%;
                justify-content: space-between;
                margin-top: 8px;
            }
            
            #webcam {
                width: 120px;
                height: 90px;
            }
            
            .particle-count, .hand-speed {
                font-size: 11px;
                padding: 4px 8px;
            }
            
            .hand-speed {
                left: 130px;
            }
            
            .transition-effect {
                font-size: 28px;
            }
        }
        
        @media (max-width: 480px) {
            .control-panel {
                padding: 10px;
            }
            
            .control-section {
                margin-bottom: 15px;
            }
            
            #webcam {
                width: 100px;
                height: 75px;
                top: 5px;
                right: 5px;
            }
            
            .hand-speed {
                left: 120px;
            }
        }
        
        /* 隐藏视频元素但不影响功能 */
        .hidden-video {
            position: absolute;
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>WebAR 手势粒子互动系统</h1>
            <div class="subtitle">Three.js + MediaPipe Hands | 16,000 流体粒子</div>
        </div>
        <div class="stats-container">
            <div class="stat-item">FPS: <span id="fpsCounter">0</span></div>
            <div class="stat-item">手势: <span id="gestureStatus">检测中...</span></div>
            <div class="stat-item">状态: <span id="detectionStatus">初始化...</span></div>
        </div>
    </div>
    
    <div class="container">
        <div id="canvasContainer">
            <canvas id="arCanvas"></canvas>
            <video id="webcam" autoplay muted playsinline></video>
            <div class="particle-count">粒子: <span id="particleCount">16,000</span></div>
            <div class="hand-speed">手速: <span id="handSpeed">0</span></div>
            <div class="transition-effect" id="transitionEffect"></div>
            
            <div class="loading" id="loadingScreen">
                <div class="loading-spinner"></div>
                <div class="loading-text">加载粒子系统...</div>
            </div>
        </div>
        
        <div class="control-panel">
            <div class="control-section">
                <h3><span class="status-indicator" id="handStatus"></span> 手势控制</h3>
                <ul class="gesture-list" id="gestureList">
                    <!-- 手势列表将由JS动态生成 -->
                </ul>
            </div>
            
            <div class="control-section">
                <h3>物理参数</h3>
                <div class="slider-container">
                    <label for="attractionStrength">吸引力: <span id="attractionValue">0.08</span></label>
                    <input type="range" id="attractionStrength" min="0.01" max="0.2" step="0.01" value="0.08">
                </div>
                <div class="slider-container">
                    <label for="repulsionStrength">排斥力: <span id="repulsionValue">0.15</span></label>
                    <input type="range" id="repulsionStrength" min="0.01" max="0.5" step="0.01" value="0.15">
                </div>
                <div class="slider-container">
                    <label for="damping">运动阻尼: <span id="dampingValue">0.95</span></label>
                    <input type="range" id="damping" min="0.85" max="0.99" step="0.01" value="0.95">
                </div>
            </div>
            
            <div class="control-section">
                <h3>交互控制</h3>
                <div class="slider-container">
                    <label for="handInfluence">手部影响: <span id="handInfluenceValue">1.5</span></label>
                    <input type="range" id="handInfluence" min="0.5" max="3" step="0.1" value="1.5">
                </div>
                <div class="slider-container">
                    <label for="stormStrength">风暴强度: <span id="stormStrengthValue">0.8</span></label>
                    <input type="range" id="stormStrength" min="0.1" max="2" step="0.1" value="0.8">
                </div>
            </div>
            
            <div class="instructions">
                <h4>使用说明</h4>
                <ul>
                    <li><strong>张开手掌</strong>: 粒子变为球体</li>
                    <li><strong>剪刀手</strong>: 粒子形成文字</li>
                    <li><strong>握拳</strong>: 粒子变为圆环</li>
                    <li><strong>伸出食指</strong>: 粒子变为星形</li>
                    <li><strong>竖起大拇指</strong>: 粒子变为爱心</li>
                    <li><strong>快速挥手</strong>: 吹散粒子</li>
                    <li><strong>手掌靠近/远离摄像头</strong>: 缩放粒子系统</li>
                </ul>
            </div>
        </div>
    </div>

    <!-- 隐藏的视频元素用于MediaPipe处理 -->
    <video class="hidden-video" id="hiddenVideo" autoplay muted playsinline></video>
    
    <script>
        // 确保全局变量不会污染全局命名空间
        (function() {
            'use strict';
            
            // 全局变量封装在立即执行函数中
            let scene, camera, renderer;
            let particles, particlePositions, particleVelocities, particleAccelerations;
            let particleCount = 16000;
            let handMesh;
            let currentGesture = 'none';
            let targetShape = 'sphere';
            let lastGestureChangeTime = 0;
            let explosionActive = false;
            let explosionStartTime = 0;
            let handSpeed = 0;
            let lastHandPosition = null;
            let lastHandTime = 0;
            let handSize = 0;
            let handDetected = false;
            let fpsCounter = 0, lastFpsUpdate = 0, frameCount = 0;
            let hands = null;
            let cameraUtils = null;
            
            // 初始化Three.js场景
            function initThreeJS() {
                try {
                    // 创建场景
                    scene = new THREE.Scene();
                    scene.background = new THREE.Color(0x0a0a1a);
                    scene.fog = new THREE.Fog(0x0a0a1a, 10, 25);
                    
                    // 创建相机
                    const canvas = document.getElementById('arCanvas');
                    const width = canvas.parentElement.clientWidth;
                    const height = canvas.parentElement.clientHeight;
                    
                    camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 1000);
                    camera.position.set(0, 0, 15);
                    
                    // 创建渲染器
                    renderer = new THREE.WebGLRenderer({ 
                        canvas: canvas,
                        antialias: true,
                        alpha: true,
                        powerPreference: "high-performance"
                    });
                    renderer.setSize(width, height);
                    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                    renderer.shadowMap.enabled = false;
                    
                    // 添加光源
                    const ambientLight = new THREE.AmbientLight(0x333333);
                    scene.add(ambientLight);
                    
                    const directionalLight = new THREE.DirectionalLight(0x00aaff, 0.5);
                    directionalLight.position.set(5, 5, 5);
                    scene.add(directionalLight);
                    
                    // 创建粒子系统
                    createParticleSystem();
                    
                    // 创建手部模型
                    createHandModel();
                    
                    // 处理窗口大小变化
                    window.addEventListener('resize', onWindowResize);
                    
                    // 初始化控件
                    initControls();
                    
                    // 初始化手势列表
                    initGestureList();
                    
                    console.log('Three.js初始化成功');
                    document.getElementById('detectionStatus').textContent = 'Three.js就绪';
                    
                } catch (error) {
                    console.error('Three.js初始化失败:', error);
                    document.getElementById('detectionStatus').textContent = 'Three.js初始化失败';
                }
            }
            
            // 创建粒子系统
            function createParticleSystem() {
                // 粒子几何体
                const geometry = new THREE.BufferGeometry();
                
                // 初始化粒子位置、速度和加速度数组
                particlePositions = new Float32Array(particleCount * 3);
                particleVelocities = new Float32Array(particleCount * 3);
                particleAccelerations = new Float32Array(particleCount * 3);
                
                // 初始化为随机位置
                for (let i = 0; i < particleCount * 3; i += 3) {
                    // 随机分布在球体周围
                    const radius = 5;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    
                    particlePositions[i] = radius * Math.sin(phi) * Math.cos(theta);
                    particlePositions[i + 1] = radius * Math.sin(phi) * Math.sin(theta);
                    particlePositions[i + 2] = radius * Math.cos(phi);
                    
                    // 初始速度和加速度为0
                    particleVelocities[i] = 0;
                    particleVelocities[i + 1] = 0;
                    particleVelocities[i + 2] = 0;
                    
                    particleAccelerations[i] = 0;
                    particleAccelerations[i + 1] = 0;
                    particleAccelerations[i + 2] = 0;
                }
                
                geometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
                
                // 粒子材质
                const material = new THREE.PointsMaterial({
                    color: 0x00ffff,
                    size: 0.04,
                    transparent: true,
                    opacity: 0.7,
                    blending: THREE.AdditiveBlending,
                    sizeAttenuation: true
                });
                
                // 创建粒子系统
                particles = new THREE.Points(geometry, material);
                scene.add(particles);
                
                // 更新粒子数量显示
                document.getElementById('particleCount').textContent = particleCount.toLocaleString();
            }
            
            // 创建手部模型
            function createHandModel() {
                const handGeometry = new THREE.SphereGeometry(0.04, 6, 6);
                const handMaterial = new THREE.MeshBasicMaterial({ 
                    color: 0xff0080,
                    transparent: true,
                    opacity: 0.6
                });
                
                handMesh = new THREE.InstancedMesh(handGeometry, handMaterial, 21); // 21个手部关键点
                handMesh.visible = false;
                scene.add(handMesh);
            }
            
            // 初始化手势列表
            function initGestureList() {
                const gestures = [
                    { id: 'open_hand', name: '张开手掌', icon: '🖐️', shape: 'sphere' },
                    { id: 'victory', name: '剪刀手', icon: '✌️', shape: 'text' },
                    { id: 'fist', name: '握拳', icon: '✊', shape: 'ring' },
                    { id: 'pointing', name: '伸出食指', icon: '☝️', shape: 'star' },
                    { id: 'thumb', name: '竖起大拇指', icon: '👍', shape: 'heart' }
                ];
                
                const gestureList = document.getElementById('gestureList');
                gestureList.innerHTML = '';
                
                gestures.forEach(gesture => {
                    const li = document.createElement('li');
                    li.id = `gesture-${gesture.id}`;
                    li.innerHTML = `
                        <div class="gesture-icon">${gesture.icon}</div>
                        <div class="gesture-name">${gesture.name}</div>
                        <div class="gesture-shape">${gesture.shape === 'text' ? '文字' : gesture.shape}</div>
                    `;
                    gestureList.appendChild(li);
                });
            }
            
            // 初始化MediaPipe Hands
            async function initMediaPipe() {
                try {
                    const videoElement = document.getElementById('webcam');
                    const hiddenVideo = document.getElementById('hiddenVideo');
                    
                    // 检查浏览器是否支持getUserMedia
                    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                        throw new Error('浏览器不支持摄像头访问');
                    }
                    
                    // 获取摄像头权限
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            width: { ideal: 640 },
                            height: { ideal: 480 },
                            facingMode: 'user'
                        },
                        audio: false
                    });
                    
                    videoElement.srcObject = stream;
                    hiddenVideo.srcObject = stream;
                    
                    // 等待视频可以播放
                    await new Promise((resolve) => {
                        videoElement.onloadedmetadata = () => {
                            videoElement.play();
                            hiddenVideo.play();
                            resolve();
                        };
                    });
                    
                    // 初始化MediaPipe Hands
                    hands = new Hands({
                        locateFile: (file) => {
                            // 使用CDN路径
                            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
                        }
                    });
                    
                    hands.setOptions({
                        maxNumHands: 1,
                        modelComplexity: 1,
                        minDetectionConfidence: 0.6,
                        minTrackingConfidence: 0.6
                    });
                    
                    // 手部检测结果回调
                    hands.onResults((results) => {
                        handleHandResults(results);
                    });
                    
                    // 使用camera_utils处理视频帧
                    const camera = new Camera(hiddenVideo, {
                        onFrame: async () => {
                            try {
                                await hands.send({image: hiddenVideo});
                            } catch (e) {
                                console.warn('MediaPipe处理帧时出错:', e);
                            }
                        },
                        width: 640,
                        height: 480
                    });
                    
                    await camera.start();
                    
                    // 更新检测状态
                    document.getElementById('detectionStatus').textContent = '摄像头已启动';
                    document.getElementById('handStatus').classList.add('active');
                    
                    console.log('MediaPipe Hands初始化成功');
                    
                } catch (error) {
                    console.error('MediaPipe初始化失败:', error);
                    document.getElementById('detectionStatus').textContent = '摄像头访问失败';
                    // 提供备用方案：允许使用鼠标交互
                    setupMouseInteraction();
                }
            }
            
            // 处理手部检测结果
            function handleHandResults(results) {
                handDetected = results.multiHandLandmarks && results.multiHandLandmarks.length > 0;
                
                if (!handDetected) {
                    document.getElementById('gestureStatus').textContent = '未检测到手部';
                    handMesh.visible = false;
                    return;
                }
                
                const landmarks = results.multiHandLandmarks[0];
                
                // 更新手部3D模型位置
                updateHandModel(landmarks);
                
                // 识别手势
                recognizeGesture(landmarks);
                
                // 计算手部速度
                calculateHandSpeed(landmarks);
                
                // 计算手部大小（用于深度推拉）
                calculateHandSize(landmarks);
                
                // 更新UI
                updateGestureUI();
            }
            
            // 更新手部3D模型
            function updateHandModel(landmarks) {
                if (!handMesh) return;
                
                const dummy = new THREE.Object3D();
                const scale = 15;
                
                for (let i = 0; i < Math.min(landmarks.length, 21); i++) {
                    const landmark = landmarks[i];
                    
                    // 将MediaPipe坐标转换为Three.js坐标
                    const x = (landmark.x - 0.5) * scale;
                    const y = (0.5 - landmark.y) * scale; // 反转Y轴
                    const z = (landmark.z * 10) - 5; // 调整Z轴深度
                    
                    dummy.position.set(x, y, z);
                    dummy.updateMatrix();
                    handMesh.setMatrixAt(i, dummy.matrix);
                }
                
                handMesh.instanceMatrix.needsUpdate = true;
                handMesh.visible = true;
            }
            
            // 识别手势
            function recognizeGesture(landmarks) {
                // 获取关键点
                const wrist = landmarks[0];
                const thumbTip = landmarks[4];
                const indexTip = landmarks[8];
                const middleTip = landmarks[12];
                const ringTip = landmarks[16];
                const pinkyTip = landmarks[20];
                
                // 计算手指到手腕的距离
                const distance = (p1, p2) => {
                    return Math.sqrt(
                        Math.pow(p1.x - p2.x, 2) + 
                        Math.pow(p1.y - p2.y, 2) + 
                        Math.pow(p1.z - p2.z, 2)
                    );
                };
                
                // 计算手指张开状态
                const thumbOpen = distance(thumbTip, wrist) > 0.25;
                const indexOpen = distance(indexTip, wrist) > 0.25;
                const middleOpen = distance(middleTip, wrist) > 0.25;
                const ringOpen = distance(ringTip, wrist) > 0.25;
                const pinkyOpen = distance(pinkyTip, wrist) > 0.25;
                
                // 手势识别逻辑
                let newGesture = 'none';
                let newShape = targetShape;
                
                // 张手：所有手指都张开
                if (indexOpen && middleOpen && ringOpen && pinkyOpen && thumbOpen) {
                    newGesture = 'open_hand';
                    newShape = 'sphere';
                }
                // 剪刀手：食指和中指张开，其他手指闭合
                else if (indexOpen && middleOpen && !ringOpen && !pinkyOpen) {
                    newGesture = 'victory';
                    newShape = 'text';
                }
                // 握拳：所有手指闭合
                else if (!indexOpen && !middleOpen && !ringOpen && !pinkyOpen) {
                    newGesture = 'fist';
                    newShape = 'ring';
                }
                // 食指：只有食指张开
                else if (indexOpen && !middleOpen && !ringOpen && !pinkyOpen) {
                    newGesture = 'pointing';
                    newShape = 'star';
                }
                // 大拇指：只有大拇指张开
                else if (thumbOpen && !indexOpen && !middleOpen && !ringOpen && !pinkyOpen) {
                    newGesture = 'thumb';
                    newShape = 'heart';
                }
                
                // 如果手势变化，触发爆炸过渡
                if (newGesture !== currentGesture && newGesture !== 'none') {
                    currentGesture = newGesture;
                    triggerExplosion();
                    
                    // 显示过渡效果
                    const shapeNames = {
                        'sphere': '球体',
                        'text': '文字效果',
                        'ring': '圆环',
                        'star': '星形',
                        'heart': '爱心'
                    };
                    
                    const effect = document.getElementById('transitionEffect');
                    effect.textContent = shapeNames[newShape];
                    effect.style.opacity = 1;
                    
                    setTimeout(() => {
                        effect.style.opacity = 0;
                    }, 1000);
                }
                
                // 更新目标形状
                if (newShape !== targetShape && newShape !== undefined) {
                    targetShape = newShape;
                    lastGestureChangeTime = Date.now();
                }
            }
            
            // 计算手部速度
            function calculateHandSpeed(landmarks) {
                const now = Date.now();
                const wrist = landmarks[0];
                
                if (lastHandPosition && lastHandTime > 0) {
                    const timeDiff = (now - lastHandTime) / 1000;
                    if (timeDiff > 0) {
                        const dx = wrist.x - lastHandPosition.x;
                        const dy = wrist.y - lastHandPosition.y;
                        const dz = wrist.z - lastHandPosition.z;
                        
                        handSpeed = Math.sqrt(dx*dx + dy*dy + dz*dz) / timeDiff;
                        document.getElementById('handSpeed').textContent = handSpeed.toFixed(2);
                        document.getElementById('gestureStatus').textContent = currentGesture;
                    }
                }
                
                lastHandPosition = {x: wrist.x, y: wrist.y, z: wrist.z};
                lastHandTime = now;
            }
            
            // 计算手部大小（用于深度推拉）
            function calculateHandSize(landmarks) {
                const wrist = landmarks[0];
                const middleTip = landmarks[12];
                
                const dx = wrist.x - middleTip.x;
                const dy = wrist.y - middleTip.y;
                handSize = Math.sqrt(dx*dx + dy*dy);
            }
            
            // 触发爆炸过渡
            function triggerExplosion() {
                explosionActive = true;
                explosionStartTime = Date.now();
            }
            
            // 更新手势UI
            function updateGestureUI() {
                const gestureItems = document.querySelectorAll('.gesture-list li');
                gestureItems.forEach(item => {
                    item.classList.remove('active');
                    
                    if (item.id === `gesture-${currentGesture}`) {
                        item.classList.add('active');
                    }
                });
            }
            
            // 设置鼠标交互（备用方案）
            function setupMouseInteraction() {
                const canvas = document.getElementById('arCanvas');
                let mouseX = 0, mouseY = 0;
                let mouseDown = false;
                
                canvas.addEventListener('mousemove', (e) => {
                    const rect = canvas.getBoundingClientRect();
                    mouseX = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                    mouseY = -((e.clientY - rect.top) / rect.height) * 2 + 1;
                    
                    // 模拟手部位置
                    if (handMesh) {
                        handMesh.visible = true;
                        const dummy = new THREE.Object3D();
                        const x = mouseX * 7;
                        const y = mouseY * 7;
                        
                        for (let i = 0; i < 21; i++) {
                            dummy.position.set(x + Math.random() * 0.2, y + Math.random() * 0.2, 0);
                            dummy.updateMatrix();
                            handMesh.setMatrixAt(i, dummy.matrix);
                        }
                        handMesh.instanceMatrix.needsUpdate = true;
                    }
                });
                
                canvas.addEventListener('mousedown', () => {
                    mouseDown = true;
                    // 模拟手势变化
                    const gestures = ['open_hand', 'victory', 'fist', 'pointing', 'thumb'];
                    const randomGesture = gestures[Math.floor(Math.random() * gestures.length)];
                    currentGesture = randomGesture;
                    updateGestureUI();
                });
                
                canvas.addEventListener('mouseup', () => {
                    mouseDown = false;
                });
                
                document.getElementById('detectionStatus').textContent = '使用鼠标交互';
                document.getElementById('gestureStatus').textContent = '鼠标模式';
            }
