<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Landscape - Improved</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000000; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }

        #ui-layer {
            position: absolute; top: 20px; left: 20px; pointer-events: none; z-index: 10;
        }
        .panel {
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);
            padding: 20px; border-radius: 6px; border: 1px solid rgba(0, 255, 255, 0.2);
            color: #eee; width: 260px; pointer-events: auto;
        }
        h1 {
            margin: 0 0 15px 0; font-size: 14px; letter-spacing: 2px;
            text-transform: uppercase; color: #00ffff; text-align: center;
            border-bottom: 1px solid rgba(0, 255, 255, 0.2); padding-bottom: 10px;
        }
        .status-text { font-size: 12px; color: #888; display: block; text-align: center; margin-bottom: 10px; }
        button {
            width: 100%; padding: 10px; background: transparent;
            border: 1px solid #00ffff; color: #00ffff;
            cursor: pointer; font-size: 12px; transition: 0.3s;
            text-transform: uppercase; letter-spacing: 1px;
        }
        button:hover { background: rgba(0, 255, 255, 0.2); box-shadow: 0 0 15px rgba(0,255,255,0.4); }

        #cam-container {
            position: absolute; bottom: 20px; right: 20px;
            width: 160px; height: 120px; z-index: 5;
            border: 1px solid #333; background: #000;
            transform: scaleX(-1); opacity: 0.8;
        }
        #cam-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.4; }
        #output-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 6; }
    </style>

    <!-- Scripts and Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
    <!-- UI Layer -->
    <div id="ui-layer">
        <div class="panel">
            <h1>Particle Void</h1>
            <span class="status-text" id="status-text">Initializing...</span>
            <button id="fs-btn">Full Screen Mode</button>
            <div style="font-size:10px; color:#555; margin-top:10px; text-align:center;">
                * GPU-Optimized with 350K Particles *
            </div>
        </div>
    </div>

    <!-- Camera Container -->
    <div id="cam-container">
        <video id="cam-video" playsinline muted autoplay></video>
        <canvas id="output-canvas"></canvas>
    </div>

    <script>
        // ===================== Configurations =====================
        const CONFIG = {
            particleCount: 350000,
            rangeX: 120,
            rangeZ: 140,
            dustCount: 20000,
            fpsCap: 30 // Frame rate cap for MediaPipe
        };

        // ===================== Three.js Scene =====================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#000');
        scene.fog = new THREE.Fog(0x000000, 30, 200);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 500);
        camera.position.set(0, 15, 50);

        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        document.body.appendChild(renderer.domElement);

        // ===================== Particle System =====================
        const positions = [];
        for (let i = 0; i < CONFIG.particleCount; i++) {
            positions.push(
                Math.random() * CONFIG.rangeX - CONFIG.rangeX / 2,
                0,
                Math.random() * CONFIG.rangeZ - CONFIG.rangeZ / 2
            );
        }
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));

        const uniforms = {
            uTime: { value: 0 },
            uColor: { value: new THREE.Color(0xffffff) }
        };

        const material = new THREE.PointsMaterial({
            size: 0.5,
            color: 0x00ccff,
            blending: THREE.AdditiveBlending,
            transparent: true
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // ===================== Animation =====================
        const clock = new THREE.Clock();
        function animate() {
            uniforms.uTime.value = clock.getElapsedTime();
            particles.rotation.y += 0.001;
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();

        // ===================== Full Screen Toggle =====================
        document.getElementById('fs-btn').addEventListener('click', () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        });

        // ===================== MediaPipe Integration =====================
        const video = document.getElementById('cam-video');
        const onResults = (results) => { /* Integrate hand tracking gestures */ };

        const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 0,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        const cameraUtils = new Camera(video, { onFrame: async () => await hands.send({ image: video }) });
        cameraUtils.start();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
