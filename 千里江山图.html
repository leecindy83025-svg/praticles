<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive 3D Particles</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', sans-serif;
        }
        canvas {
            display: block;
        }
        /* UI Panel */
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            pointer-events: auto;
            width: 280px;
        }
        .panel {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            padding: 15px;
            border-radius: 6px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            color: #eee;
        }
        h1 {
            font-size: 16px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #00ffff;
            text-align: center;
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
            padding-bottom: 10px;
        }
        label {
            font-size: 13px;
            color: #ccc;
            display: block;
            margin-top: 10px;
        }
        select, input[type="color"], button {
            width: 100%;
            background: transparent;
            border: 1px solid #00ffff;
            color: #00ffff;
            padding: 7px;
            font-size: 12px;
            border-radius: 4px;
            margin-top: 5px;
            cursor: pointer;
        }
        button:hover {
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }
        button:active {
            transform: scale(0.98);
        }
        #fullscreen-btn {
            margin-top: 10px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands"></script>
</head>
<body>
    <div id="ui-panel">
        <div class="panel">
            <h1>3D Particles</h1>
            <label for="model-select">Choose Model:</label>
            <select id="model-select">
                <option value="heart">Heart</option>
                <option value="flower">Flower</option>
                <option value="saturn">Saturn</option>
                <option value="fireworks">Fireworks</option>
            </select>
            <label for="color-picker">Particle Color:</label>
            <input type="color" id="color-picker" value="#00ffff">
            <button id="fullscreen-btn">Toggle Fullscreen</button>
        </div>
    </div>
    <script>
        // ========================= SETTINGS =========================
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const particleCount = 5000;
        let particleColor = 0x00ffff;
        const particleGroup = new THREE.Group();

        // ========================= PARTICLE HELPER =========================
        function generateParticles(shape) {
            particleGroup.clear();
            let positions = [];
            
            for (let i = 0; i < particleCount; i++) {
                let x, y, z;
                // Generate shape positions
                switch (shape) {
                    case 'heart':
                        x = (Math.random() - 0.5) * 5;
                        y = (Math.random() - 0.5) * 5;
                        z = (Math.random())*4
```html
                        break;
                    case 'flower':
                        const theta = Math.random() * Math.PI * 2;
                        x = Math.cos(theta) * (Math.random() * 2 + 1);
                        y = Math.sin(theta) * (Math.random() * 2 + 1);
                        z = (Math.random() - 0.5) * 2;
                        break;
                    case 'saturn':
                        const angle = Math.random() * Math.PI * 2;
                        x = Math.cos(angle) * (Math.random() * 2 + 3);
                        y = Math.sin(angle) * (Math.random() * 2 + 3);
                        z = (Math.random() - 0.5) * 2;
                        break;
                    case 'fireworks':
                        x = (Math.random() - 0.5) * 6;
                        y = (Math.random() - 0.5) * 6;
                        z = (Math.random() - 0.5) * 6;
                        break;
                }
                positions.push(x, y, z);
            }

            const bufferGeometry = new THREE.BufferGeometry();
            bufferGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));

            const material = new THREE.PointsMaterial({
                size: 0.1,
                color: particleColor,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });

            const particles = new THREE.Points(bufferGeometry, material);
            particleGroup.add(particles);
            scene.add(particleGroup);
        }

        // ========================= GESTURE TRACKING =========================
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`,
        });
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.8,
            minTrackingConfidence: 0.8,
        });

        const video = document.createElement('video');
        video.setAttribute('autoplay', true);
        video.setAttribute('playsinline', true);
        navigator.mediaDevices
            .getUserMedia({ video: true })
            .then((stream) => {
                video.srcObject = stream;
                video.onloadedmetadata = () => video.play();
            });

        const updateParticlesFromGesture = (results) => {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                const wrist = landmarks[0];
                const middleTip = landmarks[12];

                const handDistance = Math.sqrt(
                    Math.pow(wrist.x - middleTip.x, 2) + Math.pow(wrist.y - middleTip.y, 2)
                );
                const scale = THREE.MathUtils.clamp(handDistance * 10, 0.5, 3.0);

                particleGroup.scale.set(scale, scale, scale);
            }
        };

        hands.onResults(updateParticlesFromGesture);

        // ========================= SETUP RENDER LOOP =========================
        let chosenModel = 'heart';
        document.getElementById('model-select').addEventListener('change', (e) => {
            chosenModel = e.target.value;
            generateParticles(chosenModel);
        });

        document.getElementById('color-picker').addEventListener('input', (e) => {
            particleColor = e.target.value;
            generateParticles(chosenModel);
        });

        document.getElementById('fullscreen-btn').addEventListener('click', () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        });

        camera.position.z = 10;
        generateParticles(chosenModel);

        function animate() {
            requestAnimationFrame(animate);
            particleGroup.rotation.y += 0.005; // Subtle Rotation of Particles
            renderer.render(scene, camera);
        }

        animate();

        // ========================= MEDIA HANDLER =========================
        const handsCamera = new Camera(video, {
            onFrame: async () => {
                await hands.send({ image: video });
            },
        });
        handsCamera.start();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
